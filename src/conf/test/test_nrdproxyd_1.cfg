################
# NuoRDS Proxy Server. 
# 
# Test configuration.
# 
# Lines, which begin with the hash character "#" or 
# the semicolon ";" will be ignored.
#

################
[proxy]

listeners = 0.0.0.0:3390, [::]:3390

info_enabled = 1
info_port = 4074

;info_period = 15
;status_period = 300
cache_timeout = 0
;conn_timeout = 30
;max_faults = 2

socket_mode = 1
buffer_mode = 1

;max_buffer = 131072

################
[server.server01]

address = 127.0.0.1

info_port = 4073

check_mode = 3 
max_weight = 100
max_slots = 1000
;redundant = 1

################
[client.general]

sources = 0.0.0.0/0 ::/0
max_slots = 10

################
[balancer.balancer01]

clients = all
servers = all

;method = bybusyness
;metrics = cap mem cpu
